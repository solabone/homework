---
- name: Docker, Jenkins, Go, Nexus
  hosts: jenkins
  become: true
  vars:
    go_version: "1.21.13"
    nexus_image: "sonatype/nexus3"

  tasks:
    - name: cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: utils
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - ca-certificates
          - gnupg
        state: present

    - name: gpg docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: docker repo
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        update_cache: true

    - name: docker CE
      apt:
        name: docker-ce
        state: present
        update_cache: yes

    - name: start docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: add user to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      become: true


    - name: docker compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-{{ ansible_system | lower }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: jenkins key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: jenkins repo
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        update_cache: true

        
    - name: install jdk
      apt:
        name: openjdk-21-jdk
        state: present
        update_cache: yes

    - name: jenkins install
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: restart jenkins
      service:
        name: jenkins
        state: restarted
      become: true

    - name: start jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: go
      get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /tmp/go.tar.gz

    - name: go setup
      unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: yes
        creates: /usr/local/go/bin/go

    - name: go PATH
      copy:
        content: |
          export PATH=$PATH:/usr/local/go/bin
        dest: /etc/profile.d/go.sh
        mode: "0644"
        owner: root
        group: root

    - name: wait for docker socket
      wait_for:
        path: /var/run/docker.sock
        timeout: 60

    - name: volume for nexus
      docker_volume:
        name: nexus-data

    - name: start nexus
      docker_container:
        name: nexus
        image: "{{ nexus_image }}"
        restart_policy: unless-stopped
        ports:
          - "8081:8081"
          - "8082:8082"
        volumes:
          - nexus-data:/nexus-data
        state: started

    - name: daemon.json for insecure registry
      copy:
        content: |
          {
            "insecure-registries": ["127.0.0.1:8082"]
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      register: daemon_json_result    # ← на уровне задачи, не модуля

    - name: restart docker
      service:
        name: docker
        state: restarted
      when: daemon_json_result.changed



