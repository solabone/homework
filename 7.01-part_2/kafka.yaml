---
- name: Apache Kafka
  hosts: localhost
  connection: local
  become: true
  vars:
    kafka_version: "4.3.1"
    kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka-{{ kafka_version }}-src.tgz"
    kafka_dir: "/opt/kafka"
    kafka_archive: "/tmp/kafka-{{ kafka_version }}.tgz"

  tasks:
    - name: Create directory
      file:
        path: "{{ kafka_dir }}"
        state: directory
        mode: "0755"

    - name: Download
      get_url:
        url: "{{ kafka_url }}"
        dest: "{{ kafka_archive }}"
        mode: "0644"
        timeout: 300

    - name: Extract Kafka
      unarchive:
        src: "{{ kafka_archive }}"
        dest: "{{ kafka_dir }}"
        remote_src: yes
        creates: "{{ kafka_dir }}/kafka-{{ kafka_version }}"

    - name: Clean up
      file:
        path: "{{ kafka_archive }}"
        state: absent
