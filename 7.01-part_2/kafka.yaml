---
- name: Download and extract Apache Kafka
  hosts: localhost
  connection: local
  become: true

  vars:
    kafka_version: "4.3.1"
    kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka-{{ kafka_version }}-src.tgz"
    kafka_dir: "/opt/kafka"
    kafka_archive: "/tmp/kafka-{{ kafka_version }}-src.tgz"

  tasks:
    - name: Create directory for extraction
      file:
        path: "{{ kafka_dir }}"
        state: directory
        mode: "0755"

    - name: Download archive
      get_url:
        url: "{{ kafka_url }}"
        dest: "{{ kafka_archive }}"
        mode: "0644"
        timeout: 300

    - name: Extract archive
      unarchive:
        src: "{{ kafka_archive }}"
        dest: "{{ kafka_dir }}"
        remote_src: yes

    - name: Remove archive
      file:
        path: "{{ kafka_archive }}"
        state: absent
